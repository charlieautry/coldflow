name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware-tests:
    name: firmware off-target tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -B firmware/build-host -S firmware -DCOLDFLOW_HOST_TESTS=ON
      - name: build
        run: cmake --build firmware/build-host
      - name: test
        run: ctest --test-dir firmware/build-host --output-on-failure

  host-tests:
    name: host pytest suite (fake board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e "./host[dev]"
      - name: pytest
        working-directory: host
        run: pytest -v
