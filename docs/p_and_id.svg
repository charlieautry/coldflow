<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1000 700" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="700" fill="white"/>
  <title>Coldflow Rig P&amp;ID</title>

  <!-- Title -->
  <text x="500" y="28" font-size="20" font-weight="bold" text-anchor="middle" fill="black">Coldflow Rig P&amp;ID</text>

  <!-- Pressure budget box -->
  <rect x="30" y="45" width="230" height="105" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="42" y="66" font-size="13" font-weight="bold" fill="black">Pressure budget</text>
  <text x="42" y="86" font-size="12" fill="black">operate: 5-15 psi</text>
  <text x="42" y="104" font-size="12" fill="black">software abort: 21 psi</text>
  <text x="42" y="122" font-size="12" fill="black">PT-101 full scale: 29 psi</text>
  <text x="42" y="140" font-size="12" fill="black">pump relief: 30-40 psi</text>

  <!-- Legend box -->
  <rect x="730" y="40" width="240" height="132" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="742" y="60" font-size="13" font-weight="bold" fill="black">Legend</text>
  <polygon points="740,74 740,86 752,80" fill="white" stroke="black" stroke-width="1.5"/>
  <polygon points="764,74 764,86 752,80" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="775" y="84" font-size="12" fill="black">valve body (SV, FCV)</text>
  <circle cx="752" cy="100" r="9" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="775" y="104" font-size="12" fill="black">instrument bubble (tag)</text>
  <circle cx="752" cy="120" r="9" fill="white" stroke="black" stroke-width="1.5"/>
  <polygon points="748,115 748,125 759,120" fill="none" stroke="black" stroke-width="1.2"/>
  <text x="775" y="124" font-size="12" fill="black">pump</text>
  <polygon points="742,135 742,145 754,140" fill="white" stroke="black" stroke-width="1.5"/>
  <line x1="754" y1="135" x2="754" y2="145" stroke="black" stroke-width="2.5"/>
  <text x="775" y="144" font-size="12" fill="black">check valve (one way)</text>
  <line x1="748" y1="154" x2="748" y2="166" stroke="black" stroke-width="1.5"/>
  <line x1="756" y1="154" x2="756" y2="166" stroke="black" stroke-width="1.5"/>
  <text x="775" y="164" font-size="12" fill="black">sight glass</text>

  <!-- ============ PIPING ============ -->
  <g stroke="black" stroke-width="2" fill="none">
    <!-- feed: reservoir to pump to check valve to riser -->
    <path d="M 200 620 H 256"/>
    <path d="M 304 620 H 352"/>
    <path d="M 378 620 H 460"/>
    <path d="M 460 620 V 470"/>
    <!-- PT-101 tee stub -->
    <path d="M 415 620 V 583"/>
    <!-- sight glass bottom stub off the feed riser -->
    <path d="M 460 540 H 620"/>
    <!-- vent riser and header -->
    <path d="M 460 260 V 180"/>
    <path d="M 460 180 H 880"/>
    <!-- gauge stub -->
    <path d="M 540 180 V 153"/>
    <!-- sight glass stubs -->
    <path d="M 620 180 V 230"/>
    <path d="M 620 510 V 540"/>
    <!-- SV-201 drop to the return header -->
    <path d="M 720 180 V 264"/>
    <path d="M 720 296 V 670"/>
    <!-- FCV / FT drop to the return header -->
    <path d="M 880 180 V 304"/>
    <path d="M 880 336 V 418"/>
    <path d="M 880 462 V 670"/>
    <!-- return header back to the reservoir -->
    <path d="M 880 670 H 40"/>
    <path d="M 40 670 V 460"/>
    <path d="M 40 460 H 120"/>
    <path d="M 120 460 V 495"/>
  </g>

  <!-- sight glass parallel tube -->
  <line x1="614" y1="230" x2="614" y2="510" stroke="black" stroke-width="1.5"/>
  <line x1="626" y1="230" x2="626" y2="510" stroke="black" stroke-width="1.5"/>
  <line x1="614" y1="230" x2="626" y2="230" stroke="black" stroke-width="1.5"/>
  <line x1="614" y1="510" x2="626" y2="510" stroke="black" stroke-width="1.5"/>
  <text x="636" y="378" font-size="11" fill="black">sight glass</text>

  <!-- ============ EQUIPMENT ============ -->

  <!-- Reservoir (open top) -->
  <path d="M 80 500 V 650 H 200 V 500" fill="white" stroke="black" stroke-width="2"/>
  <line x1="86" y1="530" x2="194" y2="530" stroke="black" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="140" y="518" font-size="11" text-anchor="middle" fill="black">open top</text>
  <text x="140" y="590" font-size="12" font-weight="bold" text-anchor="middle" fill="black">RESERVOIR</text>
  <text x="140" y="607" font-size="11" text-anchor="middle" fill="black">distilled water</text>

  <!-- Pump P-101 -->
  <circle cx="280" cy="620" r="24" fill="white" stroke="black" stroke-width="2"/>
  <polygon points="268,606 268,634 296,620" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="280" y="570" font-size="12" font-weight="bold" text-anchor="middle" fill="black">P-101 pump</text>
  <text x="280" y="585" font-size="11" text-anchor="middle" fill="black">internal relief 30-40 psi</text>

  <!-- Check valve -->
  <polygon points="352,608 352,632 378,620" fill="white" stroke="black" stroke-width="1.5"/>
  <line x1="378" y1="608" x2="378" y2="632" stroke="black" stroke-width="3"/>
  <text x="370" y="652" font-size="11" text-anchor="middle" fill="black">check valve</text>

  <!-- PT-101 -->
  <circle cx="415" cy="563" r="20" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="415" y="561" font-size="12" font-weight="bold" text-anchor="middle" fill="black">PT</text>
  <text x="415" y="574" font-size="11" text-anchor="middle" fill="black">101</text>
  <text x="415" y="532" font-size="11" text-anchor="middle" fill="black">4-20 mA, 0-0.2 MPa</text>

  <!-- Chamber TK-101 -->
  <rect x="420" y="260" width="80" height="210" rx="10" fill="white" stroke="black" stroke-width="2"/>
  <text x="460" y="352" font-size="13" font-weight="bold" text-anchor="middle" fill="black">TK-101</text>
  <text x="460" y="370" font-size="10" text-anchor="middle" fill="black">2 in sch 40 PVC</text>

  <!-- TT-101 -->
  <line x1="390" y1="320" x2="420" y2="320" stroke="black" stroke-width="1.5"/>
  <circle cx="370" cy="320" r="20" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="370" y="318" font-size="12" font-weight="bold" text-anchor="middle" fill="black">TT</text>
  <text x="370" y="331" font-size="11" text-anchor="middle" fill="black">101</text>
  <text x="360" y="356" font-size="10" text-anchor="middle" fill="black">Type K + MAX31855</text>

  <!-- Glycerin gauge PI -->
  <circle cx="540" cy="133" r="20" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="540" y="138" font-size="12" font-weight="bold" text-anchor="middle" fill="black">PI</text>
  <text x="540" y="100" font-size="11" text-anchor="middle" fill="black">0-30 psi glycerin gauge (truth ref)</text>

  <!-- SV-201 solenoid vent (normally open, abort path) -->
  <polygon points="706,264 734,264 720,280" fill="white" stroke="black" stroke-width="1.5"/>
  <polygon points="706,296 734,296 720,280" fill="white" stroke="black" stroke-width="1.5"/>
  <rect x="668" y="268" width="28" height="24" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="682" y="285" font-size="12" font-weight="bold" text-anchor="middle" fill="black">S</text>
  <line x1="696" y1="280" x2="714" y2="280" stroke="black" stroke-width="1.5"/>
  <text x="744" y="246" font-size="12" font-weight="bold" fill="black">ABORT PATH</text>
  <text x="744" y="262" font-size="12" fill="black">SV-201</text>
  <text x="744" y="278" font-size="11" fill="black">N.O. solenoid vent, 12 V</text>
  <text x="744" y="293" font-size="11" fill="black">energize to close</text>

  <!-- FCV-101 needle valve with servo actuator -->
  <polygon points="866,304 894,304 880,320" fill="white" stroke="black" stroke-width="1.5"/>
  <polygon points="866,336 894,336 880,320" fill="white" stroke="black" stroke-width="1.5"/>
  <line x1="880" y1="320" x2="908" y2="320" stroke="black" stroke-width="1.5"/>
  <rect x="908" y="308" width="36" height="24" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="926" y="325" font-size="12" font-weight="bold" text-anchor="middle" fill="black">M</text>
  <text x="926" y="348" font-size="10" text-anchor="middle" fill="black">SCS0009 servo</text>
  <text x="926" y="360" font-size="10" text-anchor="middle" fill="black">2:1 gear set</text>
  <text x="858" y="318" font-size="12" text-anchor="end" fill="black">FCV-101</text>
  <text x="858" y="333" font-size="11" text-anchor="end" fill="black">needle valve</text>

  <!-- Flow sensor FT -->
  <circle cx="880" cy="440" r="22" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="880" y="445" font-size="12" font-weight="bold" text-anchor="middle" fill="black">FT</text>
  <text x="908" y="436" font-size="11" fill="black">GREDIA hall</text>
  <text x="908" y="451" font-size="11" fill="black">F = 23 x Q</text>

  <!-- return label -->
  <text x="560" y="660" font-size="11" text-anchor="middle" fill="black">return to reservoir</text>

  <!-- ============ FLOW ARROWS ============ -->
  <g fill="black" stroke="none">
    <polygon points="240,615 240,625 250,620"/>
    <polygon points="455,515 465,515 460,505"/>
    <polygon points="455,225 465,225 460,215"/>
    <polygon points="575,175 575,185 585,180"/>
    <polygon points="790,175 790,185 800,180"/>
    <polygon points="715,370 725,370 720,380"/>
    <polygon points="875,230 885,230 880,240"/>
    <polygon points="875,490 885,490 880,500"/>
    <polygon points="510,665 510,675 500,670"/>
    <polygon points="115,485 125,485 120,495"/>
  </g>
</svg>
